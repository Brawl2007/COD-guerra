<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Atlas original de materiais M01</title>
<style>body{margin:0;background:#17201e;color:#eee8d8;font:15px system-ui}header{padding:16px 24px;background:#25312d}h1{font-size:21px;margin:0 0 12px}label{margin-right:20px}select,button{font:inherit;padding:5px;background:#e8e3d6;color:#17201e;border:0;border-radius:3px}canvas{display:block;width:100%;height:calc(100vh - 142px)}#status{padding:9px 24px;font-size:13px}#error{color:#ffb08b}</style></head>
<body><header><h1>Atlas original PBR de materiais M01</h1><label>Material <select id="family"></select></label><label>Qualidade <select id="tier"><option value="high">Alta · 1024²</option><option value="low">Baixa · 512²</option></select></label><label>Distância <select id="distance"><option value="1">1 m</option><option value="5" selected>5 m</option><option value="20">20 m</option></select></label></header><canvas id="view"></canvas><div id="status">A carregar albedo, normal e ORM originais…</div><div id="error"></div>
<script type="module">
import * as THREE from 'three';
import { M01MaterialLibrary, M01_MATERIAL_REGISTRY } from '../../../src/render/materials.js';
const canvas=document.querySelector('#view'),familySelect=document.querySelector('#family'),tierSelect=document.querySelector('#tier'),distanceSelect=document.querySelector('#distance'),status=document.querySelector('#status');
const params=new URLSearchParams(location.search),state={family:params.get('material')??'brick',tier:params.get('tier')==='low'?'low':'high',distance:[1,5,20].includes(+params.get('distance'))?+params.get('distance'):5};
for(const descriptor of Object.values(M01_MATERIAL_REGISTRY)){const option=document.createElement('option');option.value=descriptor.id;option.textContent=descriptor.id;familySelect.append(option);}
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor('#8b9590');renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,1,.03,200);scene.add(new THREE.HemisphereLight('#e4e8ec','#6a604d',2));const key=new THREE.DirectionalLight('#fff0d8',3);key.position.set(-3,5,4);scene.add(key);
// A six by four metre board, with true physical tiling. Camera-to-board distance is exactly 1/5/20 m.
const initialMaterial=new THREE.MeshStandardMaterial(),geometry=new THREE.PlaneGeometry(6,4),board=new THREE.Mesh(geometry,initialMaterial);board.position.y=1.5;scene.add(board);
let library=null,request=0,disposed=false;const materialCache=new Map(),uv=geometry.attributes.uv;
const api=window.materialViewer={ready:null,status:'loading',setDistance,setFamily,setTier,get diagnostics(){return {...state,status:api.status,materialIds:Object.keys(M01_MATERIAL_REGISTRY),maps:['albedo','normal','orm'],...(library?.diagnostics??{loaded:false,textures:0}),cameraDistance:camera.position.z,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};}};
function draw(){if(disposed)return;renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.position.set(0,1.5,state.distance);camera.lookAt(0,1.5,0);camera.updateProjectionMatrix();renderer.render(scene,camera);const d=library?.diagnostics;status.textContent=`${state.family} · ${state.distance} m · ${state.tier==='high'?'Alta':'Baixa'} · albedo / normal tangencial / ORM · ${d?.textures??0} mapas partilhados · ${((d?.decodedBytes??0)/1048576).toFixed(1)} MiB descodificados · original procedural CC0-1.0`;}
function setFamily(id){if(!(id in M01_MATERIAL_REGISTRY))throw new RangeError(`Material desconhecido: ${id}`);state.family=id;familySelect.value=id;if(library){let material=materialCache.get(id);if(!material){material=library.createMaterial(id);materialCache.set(id,material);}if(board.material===initialMaterial)initialMaterial.dispose();board.material=material;const scale=M01_MATERIAL_REGISTRY[id].tileMetres;for(let i=0;i<uv.count;i++)uv.setXY(i,(geometry.attributes.position.getX(i)+3)/scale,(geometry.attributes.position.getY(i)+2)/scale);uv.needsUpdate=true;geometry.setAttribute('uv1',uv);draw();}return api.diagnostics;}
function setDistance(distance){distance=Number(distance);if(![1,5,20].includes(distance))throw new RangeError('A distância deve ser 1, 5 ou 20 metros');state.distance=distance;distanceSelect.value=String(distance);draw();return api.diagnostics;}
async function setTier(tier){if(!['high','low'].includes(tier))throw new RangeError('A qualidade deve ser high ou low');const token=++request;api.status='loading';const next=await M01MaterialLibrary.load({quality:tier});if(disposed||token!==request){next.dispose();return api.diagnostics;}library?.dispose();library=next;materialCache.clear();state.tier=tier;tierSelect.value=tier;api.status='ready';setFamily(state.family);return api.diagnostics;}
familySelect.onchange=()=>setFamily(familySelect.value);distanceSelect.onchange=()=>setDistance(distanceSelect.value);tierSelect.onchange=()=>{api.ready=setTier(tierSelect.value);api.ready.catch(report);};window.addEventListener('resize',draw);function report(error){api.status='failed';document.querySelector('#error').textContent=error.message;throw error;}
window.addEventListener('pagehide',()=>{disposed=true;request++;library?.dispose();if(board.material===initialMaterial)initialMaterial.dispose();geometry.dispose();renderer.dispose();},{once:true});
api.ready=setTier(state.tier).then(()=>{setDistance(state.distance);return api.diagnostics;}).catch(report);
</script></body></html>
