<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>M01 — motion clips review</title>
<style>
html,body{margin:0;background:#677071;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block}header{position:absolute;top:0;left:0;right:0;background:#152025e8;color:#fff;padding:7px 14px;font-size:15px;z-index:2}.panel{position:absolute;background:#ffffffde;color:#152025;padding:3px 9px;font-size:12px;border-radius:2px}.a{left:12px;top:48px}.b{left:calc(50% + 12px);top:48px}.c{left:12px;top:calc(50% + 14px)}.d{left:calc(50% + 12px);top:calc(50% + 14px)}footer{position:absolute;bottom:0;left:0;right:0;background:#152025db;color:#eef3f5;padding:5px 14px;font-size:11px}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<header id="title">M01 — original motion package</header><div class="panel a" id="a"></div><div class="panel b">Novo · frontal</div><div class="panel c" id="c"></div><div class="panel d">Novo · lateral</div>
<footer>Galeria isolada com GLTFLoader / AnimationMixer · modelos originais · chão Y=0 · sem integração no jogo</footer>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone } from 'three/addons/utils/SkeletonUtils.js';
const DIR='/assets/models/provisional/m01/characters/', NEW=DIR+'motion-clips-v1/m01_soldier_motion_clips.glb', OLD=DIR+'m01_soldier_animations.glb';
const baseline={sprint:'run',crouch_walk:'crouched_idle',turn_left:'standing_idle',turn_right:'standing_idle',hit_front:'standing_idle',near_miss_duck:'pinned'};
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scenes=[],cameras=[],loader=new GLTFLoader(),cache=new Map();let actors=[],current=null;
for(let i=0;i<2;i++){
 const scene=new THREE.Scene();scene.background=new THREE.Color('#a2aaa8');scene.add(new THREE.HemisphereLight('#f0f6f9','#4b4840',2.0));
 const sun=new THREE.DirectionalLight('#fff5e3',2.6);sun.position.set(-3,5,-4);scene.add(sun);const fill=new THREE.DirectionalLight('#c2daef',1.1);fill.position.set(3,3,2);scene.add(fill);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:'#74786c',roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
 const grid=new THREE.GridHelper(2,10,'#434d43','#8b9383');grid.position.y=.0005;scene.add(grid);scenes.push(scene);
}
for(const side of [false,true]){
 const camera=new THREE.OrthographicCamera(-1.47,1.47,1.035,-1.035,.05,40);camera.position.set(...(side?[4,1.04,.04]:[0,1.04,-4]));camera.lookAt(0,.90,.04);cameras.push(camera);
}
async function load(url){if(!cache.has(url))cache.set(url,await loader.loadAsync(url));return cache.get(url);}
function animate(root,clip){const mixer=new THREE.AnimationMixer(root),action=mixer.clipAction(clip).setLoop(THREE.LoopOnce);action.clampWhenFinished=true;action.play();return{root,mixer,clip,action};}
function meshInfo(root){let meshes=0,triangles=0,bones=0;root.traverseVisible(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;if(o.skeleton)bones=Math.max(bones,o.skeleton.bones.length);}});return{meshes,triangles,bones};}
function poseSignature(root){let hash=2166136261;for(const name of ['hips','spine_03','head','hand_l','hand_r','foot_l','foot_r','weapon']){const bone=root.getObjectByName(name);for(const value of bone.matrixWorld.elements){hash^=Math.round(value*100000);hash=Math.imul(hash,16777619);}}return(hash>>>0).toString(16).padStart(8,'0');}
function render(){renderer.setScissorTest(true);const w=innerWidth/2,h=innerHeight/2;let calls=0;for(let row=0;row<2;row++)for(let col=0;col<2;col++){renderer.setViewport(col*w,(1-row)*h,w,h);renderer.setScissor(col*w,(1-row)*h,w,h);renderer.render(scenes[col],cameras[row]);calls+=renderer.info.render.calls;}renderer.setScissorTest(false);return calls;}
window.motionStage={
 async show(name,phase=0,nation='pl',lod=0){
  const key=`${nation}:${lod}:${name}`;
  if(current!==key){
   for(let i=0;i<actors.length;i++){actors[i].mixer.stopAllAction();scenes[i].remove(actors[i].root);}actors=[];
   const [model,old,newer]=await Promise.all([load(DIR+`m01_soldier_${nation}_lod${lod}.glb`),load(OLD),load(NEW)]);
   for(const [i,source,clipName] of [[0,old,baseline[name]],[1,newer,name]]){
    const root=clone(model.scene);root.traverse(o=>{if(o.isMesh){o.visible=o.userData.visible!==false;o.frustumCulled=false;}});
    const clip=source.animations.find(c=>c.name===clipName);if(!clip)throw new Error('Missing '+clipName);const actor=animate(root,clip);actors.push(actor);scenes[i].add(root);
   }current=key;
  }
  // LoopOnce/clamp pauses an action at its final key. Every review sample must
  // reset the action before seeking, including backward seeks after 100%.
  actors.forEach(a=>{a.action.reset().play();a.mixer.setTime(Math.min(1,Math.max(0,phase))*a.clip.duration);a.root.updateMatrixWorld(true);});
  document.getElementById('title').textContent=`${name} · ${Math.round(phase*100)}% · ${nation.toUpperCase()} LOD${lod} · ${actors[1].clip.duration.toFixed(2)} s`;
  document.getElementById('a').textContent=`Base: ${baseline[name]} · frontal`;document.getElementById('c').textContent=`Base: ${baseline[name]} · lateral`;
  return{phase,name,nation,lod,candidate:meshInfo(actors[1].root),baseline:meshInfo(actors[0].root),candidatePoseSignature:poseSignature(actors[1].root),renderCalls:render()};
 },render,
 async packageInfo(){const g=await load(NEW);let meshes=0;g.scene.traverse(o=>meshes+=Number(Boolean(o.isMesh)));const before=render();scenes[1].add(g.scene);const after=render();scenes[1].remove(g.scene);return{clips:g.animations.map(c=>({name:c.name,duration:c.duration,tracks:c.tracks.length})),packageMeshes:meshes,renderCallsBefore:before,renderCallsAfter:after,additionalCalls:after-before};},
};window.ready=true;
</script></body></html>
