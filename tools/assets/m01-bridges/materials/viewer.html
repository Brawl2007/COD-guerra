<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Original bridge material sidecar</title><style>body{margin:0;background:#26302d;color:#e6e1d6;font:16px system-ui}header{padding:16px}canvas{display:block;width:100%;height:calc(100vh - 80px)}span{margin-right:28px}</style></head><body><header>Original bridge material sidecar · CC0 new textures only · metres · albedo / +Y normal / ORM <span id="status"></span></header><canvas></canvas><script type="module">
import * as T from 'three';
const tier=new URLSearchParams(location.search).get('tier')==='low'?'low':'high',base='/COD-guerra/assets/models/provisional/m01/m01-bridges/materials/',manifest=await (await fetch(base+'manifest.json')).json(),r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight-80);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;const s=new T.Scene();s.background=new T.Color('#88958f');s.add(new T.HemisphereLight('#e4e9e6','#5d5542',2));const sun=new T.DirectionalLight('#fff3db',3);sun.position.set(-4,8,10);s.add(sun);const c=new T.PerspectiveCamera(45,innerWidth/(innerHeight-80),.1,100);c.position.set(0,0,17);c.lookAt(0,0,0);const loader=new T.TextureLoader(),materials=[],maps=[];
for(const [i,[id,d]] of Object.entries(Object.entries(manifest.materials))){const loaded={};for(const role of ['albedo','normal','orm']){const t=await loader.loadAsync(base+`${id}.${tier}.${role}.png`);t.wrapS=t.wrapT=T.RepeatWrapping;t.colorSpace=role==='albedo'?T.SRGBColorSpace:T.NoColorSpace;t.flipY=false;t.repeat.set(2,1.5);maps.push(t);loaded[role]=t;}const m=new T.MeshStandardMaterial({map:loaded.albedo,normalMap:loaded.normal,aoMap:loaded.orm,roughnessMap:loaded.orm,metalnessMap:loaded.orm,metalness:1,roughness:1});materials.push(m);const g=new T.PlaneGeometry(4,3,1,1),mesh=new T.Mesh(g,m);mesh.position.set((i%4-1.5)*4.25,(i<4?1:-1)*1.8,0);s.add(mesh);const label=document.createElement('span');label.textContent=id;document.querySelector('header').append(label);}
r.render(s,c);window.bridgeMaterialViewer={ready:true,diagnostics:{tier,families:Object.keys(manifest.materials),textures:maps.length,decodedBytes:manifest.budget.tiers[tier].decodedBytes,calls:r.info.render.calls,triangles:r.info.render.triangles}};document.querySelector('#status').textContent=`${tier} · ${(manifest.budget.tiers[tier].decodedBytes/1048576).toFixed(2)} MiB`;window.addEventListener('pagehide',()=>{for(const t of maps)t.dispose();for(const m of materials)m.dispose();s.traverse(n=>n.geometry?.dispose());r.dispose();},{once:true});
</script></body></html>
