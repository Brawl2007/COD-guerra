<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Props M01 — verificação</title>
<style>html,body{margin:0;background:#8d969a;overflow:hidden}canvas{display:block}.lab{position:fixed;font:12px/1.3 system-ui,sans-serif;color:#111;background:#ffffffc8;padding:2px 6px;border-radius:3px;white-space:pre}</style>

</head>
<body>
<script type="module">
// Página de verificação do kit de props: carrega os GLB com o GLTFLoader oficial do three.js e expõe
// window.stage.render(cells, cols, cw, ch). Não faz parte do jogo.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const loader = new GLTFLoader();
const cache = new Map();
const load = url => { if (!cache.has(url)) cache.set(url, loader.loadAsync(url)); return cache.get(url); };

// luz de madrugada: hemisférica fria, sol baixo e quente a leste, enchimento azulado
function makeScene(radius) {
  const s = new THREE.Scene();
  s.background = new THREE.Color('#a3abae');
  s.add(new THREE.HemisphereLight('#d3dce6', '#6a6350', 2.4));
  const sun = new THREE.DirectionalLight('#ffe9cc', 3.2);
  sun.position.set(-radius * 1.2, radius * 1.4, -radius * 0.9);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -radius * 1.6, right: radius * 1.6, top: radius * 1.6, bottom: -radius * 1.6, near: 0.1, far: radius * 8 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01;
  s.add(sun);
  const fill = new THREE.DirectionalLight('#b8c8e6', 0.7); fill.position.set(radius, radius * 0.6, radius); s.add(fill);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(radius * 12, radius * 12), new THREE.MeshStandardMaterial({ color: '#77766a', roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; s.add(ground);
  const grid = new THREE.GridHelper(Math.ceil(radius * 4), Math.ceil(radius * 4), '#3a3a3a', '#585548'); grid.position.y = 0.003; s.add(grid);
  return s;
}

/** cells: [{urls:[…], label}] — cada célula: modelos lado a lado (LOD0, LOD1) numa câmara ajustada a todos. */
async function render(cells, cols, cw, ch, { az = 38, el = 20 } = {}) {
  const rows = Math.ceil(cells.length / cols);
  renderer.setSize(cols * cw, rows * ch);
  document.querySelectorAll('.lab').forEach(n => n.remove());
  for (const [i, cell] of cells.entries()) {
    const gltfs = await Promise.all(cell.urls.map(load));
    const bbs = gltfs.map(g => new THREE.Box3().setFromObject(g.scene)), size = bbs.map(b => b.getSize(new THREE.Vector3()));
    const yMid = (Math.min(...bbs.map(b => b.min.y)) + Math.max(...bbs.map(b => b.max.y))) / 2;
    const gap = 0.3 * Math.max(...size.map(s => Math.max(s.x, s.z)));
    let x = 0; const centres = [];
    size.forEach(s => { centres.push(x + s.x / 2); x += s.x + gap; });
    const total = x - gap, depth = Math.max(...size.map(s => s.z)), height = Math.max(...size.map(s => s.y));
    const radius = 0.5 * Math.hypot(total, height, depth);
    const scene = makeScene(radius);
    gltfs.forEach((g, k) => {
      const o = g.scene.clone(true);
      const b = new THREE.Box3().setFromObject(o);
      o.position.x += centres[k] - total / 2 - (b.min.x + b.max.x) / 2;
      o.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
      scene.add(o);
    });
    const fov = 30, cam = new THREE.PerspectiveCamera(fov, cw / ch, 0.05, 800);
    const A = (cell.az ?? az) * Math.PI / 180, E = (cell.el ?? el) * Math.PI / 180;
    const R = radius / Math.sin(Math.min(fov * cw / ch, fov) * Math.PI / 360) * 1.2 / (cell.zoom ?? 1);
    const target = new THREE.Vector3(0, yMid, 0);
    cam.position.set(R * Math.sin(A) * Math.cos(E), Math.max(0.3, target.y + R * Math.sin(E)), R * Math.cos(A) * Math.cos(E));
    cam.lookAt(target);
    const x0 = (i % cols) * cw, y0 = (rows - 1 - Math.floor(i / cols)) * ch;
    renderer.setViewport(x0, y0, cw, ch); renderer.setScissor(x0, y0, cw, ch);
    renderer.render(scene, cam);
    const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = cell.label;
    lab.style.left = (x0 + 6) + 'px'; lab.style.top = (Math.floor(i / cols) * ch + 6) + 'px'; document.body.appendChild(lab);
  }
}
window.stage = { render };
window.ready = true;
</script>
</body>
</html>
