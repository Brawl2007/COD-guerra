<!doctype html><html lang="pt"><meta charset="utf-8"><link rel="icon" href="data:,"><title>M01 R3-a sappers: staged operation fixture</title><style>body{margin:0;overflow:hidden;background:#8d969a}canvas{display:block}</style><script type="module">
// Isolated visual fixture for package R3-a (the sappers' staged operation): the real M01Characters (GLBs, atlases, clips), the real M01RepairLine (cable, cuts, crate) and a real
// M01Simulation restored from a snapshot of a real route, on a ground mesh sampled from the simulation's own terrain. Used to tune the props and the poses quickly; the evidence
// captures are taken in the game itself (tools/verification/m01-sappers-r3a-captures.spec.js). Presentation only: nothing here writes a simulation or decides anything.
import * as THREE from 'three';
import {M01Characters} from '../../src/render/m01-characters.js';
import {M01RepairLine} from '../../src/render/m01-repair-line.js';
import {M01Simulation} from '../../src/game/m01-simulation.js';
const W=1280,H=720;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#9aa5a6');scene.fog=new THREE.Fog('#9aa5a6',40,260);
scene.add(new THREE.HemisphereLight('#d7e2ea','#4d4a38',1.5));
const sun=new THREE.DirectionalLight('#ffe9cf',2.2);sun.position.set(-30,40,-20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-25,right:25,top:25,bottom:-25,near:1,far:120});scene.add(sun,sun.target);
const sim=new M01Simulation();
// Ground: the simulation's own terrain around the working place, a 1 m lattice.
{
  const x0=-175,x1=-95,z0=-12,z1=40,nx=80,nz=52,pos=[],idx=[];
  for(let j=0;j<=nz;j++)for(let i=0;i<=nx;i++){const x=x0+(x1-x0)*i/nx,z=z0+(z1-z0)*j/nz;pos.push(x,sim.world.terrainHeightAt(x,z),z);}
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){const a=j*(nx+1)+i;idx.push(a,a+nx+1,a+1,a+1,a+nx+1,a+nx+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const ground=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:'#6d6a4b',roughness:1}));ground.receiveShadow=true;scene.add(ground);
}
const camera=new THREE.PerspectiveCamera(70,W/H,.05,500);
const characters=new M01Characters(scene,{batching:true});const line=new M01RepairLine(scene);
window.ready=false;await characters.load('high');
function frame(snapshot,cam){
  sim.restoreSnapshot(snapshot);sim.drainEvents();
  const ops=sim.sapperOps;
  line.sync(ops,sim.world);
  sun.target.position.set(-125,-2,10);
  const actors=sim.actors.filter(a=>['pawel_krawiec','sapper_2','sapper_3','marek_zielinski'].includes(a.id)).map(a=>({...a}));
  characters.update(actors,sim.clock,{x:cam.x,z:cam.z},'high',sim.battleClock,sim.world,ops);
  camera.position.set(cam.x,cam.y,cam.z);camera.fov=cam.fov??50;camera.lookAt(cam.tx,cam.ty,cam.tz);camera.updateProjectionMatrix();
  renderer.render(scene,camera);
  return {ops,clips:Object.fromEntries(actors.filter(a=>a.role==='ENGINEER').map(a=>{const v=characters.instances.get(a.id);return [a.id,{clip:v?.sampleClip??null,pos:[+a.x.toFixed(2),+a.z.toFixed(2)],posture:a.posture,crouched:a.crouched}];})),
    drawCalls:renderer.info.render.calls,url:renderer.domElement.toDataURL('image/png')};
}
window.fixture={show:(snapshot,cam)=>{const r=frame(snapshot,cam);return {ops:r.ops,clips:r.clips,url:r.url,drawCalls:r.drawCalls};},
  // Several frames of the same state at consecutive times (the pose is a pure function of the clock): for the motion of a stage.
  at:(snapshot,cam,secondsAfter)=>{sim.restoreSnapshot(snapshot);for(let i=0;i<Math.round(secondsAfter*20);i++)sim.tick(.05,{});sim.drainEvents();return frame(sim.snapshot(),cam)&&{ops:sim.sapperOps,url:renderer.domElement.toDataURL('image/png')};}};
window.ready=true;
</script>
