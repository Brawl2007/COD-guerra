name: M01 train detail coupling polish v1

on:
  push:
    branches:
      - claude/m01-train-detail-coupling-polish-v1
      - claude/m01-train-detail-coupling-polish-dws18u

concurrency:
  group: m01-train-detail-coupling-polish-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout task head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused train consist tests
        run: |
          node --test \
            tests/m01-train-consist-polish.test.js \
            tests/m01-wagon-runtime-integration.test.js \
            tests/m01-support-runtime.test.js \
            tests/m01-locomotive.test.js \
            tests/m01-panzerzug.test.js \
            tests/m01-wagons-glb.test.js

      - name: Numeric audit (base vs head, train group only)
        run: |
          mkdir -p docs/verification/m01-runtime/train-detail-coupling-polish-v1/ci
          node tools/verification/m01-train-consist-audit.mjs docs/verification/m01-runtime/train-detail-coupling-polish-v1/ci/audit.json > /dev/null

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture approved base before
        run: |
          set -euo pipefail
          git checkout 99309d9cb023cc94a07d41ff863e1362e4460570 -- src/render/m01-train-wagons.js
          npm run build
          M01_BASELINE_CAPTURE=1 npx playwright test tests/browser/m01-train-consist-polish.spec.js \
            --output=docs/verification/m01-runtime/train-detail-coupling-polish-v1/ci/before
          git checkout "$GITHUB_SHA" -- src/render/m01-train-wagons.js
          npm run build
          git diff --exit-code

      - name: Focused after browser
        run: |
          set -o pipefail
          npx playwright test tests/browser/m01-train-consist-polish.spec.js \
            --output=docs/verification/m01-runtime/train-detail-coupling-polish-v1/ci/after \
            2>&1 | tee docs/verification/m01-runtime/train-detail-coupling-polish-v1/ci/browser.log

      - name: Gameplay, mission and other presentation files unchanged
        run: |
          git diff --exit-code 99309d9cb023cc94a07d41ff863e1362e4460570 -- \
            src/game src/world src/core missions assets \
            src/render/m01-view.js src/render/m01-atmosphere.js src/render/m01-yard-wagons.js \
            src/render/m01-locomotive.js src/render/m01-panzerzug.js src/render/m01-characters.js \
            src/render/m01-environment.js src/render/m01-environment-props.js \
            package.json package-lock.json playwright.config.js

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-train-detail-coupling-polish-v1
          path: |
            docs/verification/m01-runtime/train-detail-coupling-polish-v1/ci/
            playwright-report/
            test-results/
          if-no-files-found: error
