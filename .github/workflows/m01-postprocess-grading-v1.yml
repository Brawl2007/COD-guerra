name: M01 Postprocess Grading V1

on:
  push:
    branches: [claude/m01-postprocess-grading-v1]

permissions:
  contents: read

concurrency:
  group: m01-postprocess-grading-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Authority check (presentation only)
        run: |
          set -o pipefail
          mkdir -p evidence
          # Base: the T42 water commit this stacked branch starts from. Simulation, world, core, missions, assets, the build/test config
          # and the (forbidden) water module must not change.
          git diff --exit-code 71ad067 HEAD -- src/game src/world src/core missions assets package.json package-lock.json playwright.config.js src/render/m01-water.js 2>&1 | tee evidence/authority.log
          echo "authority diff clean against 71ad067" | tee -a evidence/authority.log
          # The simulation, world and core must not import the presentation module.
          # (explicit if/exit: a bare '! grep' is exempt from 'bash -e' and could never fail the step)
          if grep -rn "m01-grading" src/game src/world src/core 2>&1 | tee -a evidence/authority.log; then echo "FAIL: src/game, src/world or src/core references m01-grading" | tee -a evidence/authority.log; exit 1; fi
          echo "no m01-grading reference in src/game, src/world, src/core" | tee -a evidence/authority.log
          # ACES tone mapping and exposure 1.15 stay exactly where they were.
          grep -n "toneMapping=THREE.ACESFilmicToneMapping;this.engine.toneMappingExposure=1.15;" src/render/three-renderer.js | tee -a evidence/authority.log
          git diff --stat 71ad067 HEAD | tee -a evidence/authority.log
      - name: npm test (TAP evidence)
        run: set -o pipefail; npm test -- --test-reporter=tap 2>&1 | tee evidence/npm-test.tap
      - name: npm run build
        run: set -o pipefail; npm run build 2>&1 | tee evidence/build.log
      - run: npx playwright install --with-deps chromium
      - name: BEFORE capture on the base commit (the Low identity and luminance comparisons read these PNGs)
        run: |
          set -o pipefail
          mkdir -p evidence/before/png
          git worktree add ../base 71ad067
          cp tests/browser/m01-postprocess-grading.spec.js ../base/tests/browser/
          cd ../base && npm ci && npm run build
          M01_GRADING_BASELINE=1 M01_GRADING_BEFORE_DIR="$GITHUB_WORKSPACE/evidence/before/png" npx playwright test tests/browser/m01-postprocess-grading.spec.js --workers=1 --retries=0 --output="$GITHUB_WORKSPACE/evidence/before/test-results" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/before/browser-before.log"
      - name: Focused browser specs (grading + T42 water regression)
        if: always()
        env:
          M01_GRADING_BEFORE_DIR: ${{ github.workspace }}/evidence/before/png
        run: set -o pipefail; npx playwright test tests/browser/m01-postprocess-grading.spec.js tests/browser/m01-water-vistula.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-postprocess-grading-v1-${{ github.sha }}
          path: |
            evidence/
            test-results/
            playwright-report/
          if-no-files-found: ignore
