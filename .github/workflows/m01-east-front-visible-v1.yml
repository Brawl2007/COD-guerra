name: M01 East Front Visible V1

on:
  push:
    branches: [claude/m01-east-front-visible-v1]

permissions:
  contents: read

concurrency:
  group: m01-east-front-visible-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Authority check (gameplay changes by design; world, core, assets and build config untouched)
        run: |
          set -o pipefail
          mkdir -p evidence
          # Base: 1881df1 (T22, accepted). T23 changes mission data, the round kinds, the simulation, the display-fire module and updateFire.
          git diff --exit-code 1881df1 HEAD -- src/world src/core assets package.json package-lock.json playwright.config.js 2>&1 | tee evidence/authority.log
          echo "authority diff clean against 1881df1" | tee -a evidence/authority.log
          git merge-base --is-ancestor 1881df1 HEAD
          echo "1881df1 is an ancestor of HEAD" | tee -a evidence/authority.log
      - name: Golden base is the simulation shipped in this checkout
        run: |
          set -o pipefail
          # The golden is generated from, and verified against, the approved simulation source named by `base` in tests/helpers/m01-anim-baseline.mjs.
          # It must be an ancestor of HEAD and src/game/m01-simulation.js must not have changed since, or the golden would describe other code.
          BASE=$(grep -oE "const base='[0-9a-f]{40}'" tests/helpers/m01-anim-baseline.mjs | grep -oE "[0-9a-f]{40}")
          test -n "$BASE"
          echo "golden base: $BASE" | tee evidence/golden-base.log
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- src/game/m01-simulation.js 2>&1 | tee -a evidence/golden-base.log
          echo "src/game/m01-simulation.js at HEAD is the golden base's" | tee -a evidence/golden-base.log
      - name: Golden re-baseline on x86 (only while the marker tests/fixtures/.golden-stale exists)
        timeout-minutes: 60
        run: |
          set -o pipefail
          mkdir -p evidence/golden
          FIX=tests/fixtures/m01-anim-gameplay-baseline.json
          echo "committed fixture sha256 (before this step): $(sha256sum $FIX | cut -d' ' -f1)" | tee evidence/golden/status.txt
          if [ -f tests/fixtures/.golden-stale ]; then
            echo "marker tests/fixtures/.golden-stale present: regenerating $FIX on $(uname -m), node $(node -v)" | tee -a evidence/golden/status.txt
            node tests/helpers/m01-anim-baseline.mjs --write-golden 2>&1 | tee evidence/golden/write-golden.log
            sha256sum $FIX | tee evidence/golden/sha256.txt
            cp $FIX evidence/golden/m01-anim-gameplay-baseline.json
            echo "REGENERATED in this run. Commit evidence/golden/m01-anim-gameplay-baseline.json (artifact) as $FIX, delete tests/fixtures/.golden-stale and push: that run verifies the committed file instead of regenerating it." | tee -a evidence/golden/status.txt
            echo "::warning title=golden regenerated in this run::npm test below verifies a fixture generated by this same job. Commit the x86 file from the artifact and delete tests/fixtures/.golden-stale for the verifying run."
          else
            echo "no marker: the committed golden is verified by npm test, not regenerated" | tee -a evidence/golden/status.txt
            sha256sum $FIX | tee evidence/golden/sha256.txt
          fi
      - name: npm test (the display-fire and east-front tests also write their 12-seed sweeps)
        env:
          M01_DISPLAY_FIRE_REPORT: ${{ github.workspace }}/evidence/display-fire-sweep.json
          M01_EAST_FRONT_REPORT: ${{ github.workspace }}/evidence/east-front-sweep.json
        run: set -o pipefail; npm test 2>&1 | tee evidence/npm-test.log
      - name: Golden, 12-seed and east-front proof lines
        run: |
          set -o pipefail
          # node --test prints the spec reporter here (`✔ name` / `✖ name`), not TAP `ok N - name`: accept both.
          OK='^\s*(ok [0-9]+ - |✔ )'; BAD='^\s*(not ok [0-9]+ - |✖ )'
          NAMES='(all gameplay bytes hashed each tick against approved base|route seed [0-9]+:|east front seed [0-9]+:|east front with covering fire)'
          grep -E "($OK|$BAD)$NAMES" evidence/npm-test.log | tee evidence/proof-lines.txt
          if grep -qE "$BAD$NAMES" evidence/npm-test.log; then echo "FAIL: a golden, route-seed or east-front proof line is not ok" | tee -a evidence/proof-lines.txt; exit 1; fi
          test "$(grep -cE "${OK}all gameplay bytes hashed each tick against approved base" evidence/npm-test.log)" = 2
          test "$(grep -cE "${OK}route seed [0-9]+:" evidence/npm-test.log)" = 12
          test "$(grep -cE "${OK}east front seed [0-9]+:" evidence/npm-test.log)" = 12
          test "$(grep -cE "${OK}east front with covering fire" evidence/npm-test.log)" = 1
          node -e "
            const fs=require('fs'),df=JSON.parse(fs.readFileSync('evidence/display-fire-sweep.json','utf8')).routes,ef=JSON.parse(fs.readFileSync('evidence/east-front-sweep.json','utf8')).routes;
            if(df.length!==12||df.some(x=>x.rngStreamSha256!==x.plainRngStreamSha256||x.windowTicks!==4000))process.exit(1);
            if(ef.length!==13||ef.some(x=>Object.keys(x.deaths).length!==6||x.flagAtWithdraw!==18||x.roundsAfterWithdraw!==0||x.minDistanceToPlayer<500))process.exit(2);
            console.log('display fire: 12 seeds, rng stream equal every tick, 4000-tick snapshot window each');
            console.log('east front: 13 routes (12 seeds + the support route), 6 falls by attrition rounds each, flag 18 at 06:00, no attrition round after it, display fire >= 500 m from the player');
          " | tee -a evidence/proof-lines.txt
      - name: npm run build
        id: build
        if: always()
        run: set -o pipefail; npm run build 2>&1 | tee evidence/build.log
      - name: Install Playwright Chromium
        if: always() && steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Focused browser spec (the distant front in the real renderer)
        if: always() && steps.build.outcome == 'success'
        run: set -o pipefail; npx playwright test tests/browser/m01-distant-front-impostors.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser-impostors.log
      - name: Focused browser tests in m01.spec.js (German fire drawn from the gates, withdrawal continuation)
        if: always() && steps.build.outcome == 'success'
        run: set -o pipefail; npx playwright test tests/browser/m01.spec.js --grep "German fire on the repair|a real withdrawal continuation" --workers=1 --retries=0 2>&1 | tee evidence/browser-m01.log
      - name: Golden status in the job summary
        if: always()
        run: |
          if [ -f tests/fixtures/.golden-stale ]; then
            echo "### Golden REGENERATED in this run (marker present) - not the final acceptance run" >> "$GITHUB_STEP_SUMMARY"
            echo "Download \`evidence/golden/m01-anim-gameplay-baseline.json\` from the artifact (sha256 in \`evidence/golden/sha256.txt\`), commit it as \`tests/fixtures/m01-anim-gameplay-baseline.json\`, delete \`tests/fixtures/.golden-stale\` and push. The next run verifies the committed x86 golden unmodified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Golden VERIFIED (no marker): the animation-contract tests ran against the committed x86 fixture" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-east-front-visible-v1-${{ github.sha }}
          path: |
            evidence/
            test-results/
            playwright-report/
          if-no-files-found: ignore
