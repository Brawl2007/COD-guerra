name: M01 battlefield FX polish v3

on:
  push:
    branches:
      - codex/m01-battlefield-fx-polish-v3

concurrency:
  group: m01-battlefield-fx-polish-v3
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout task head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Focused battlefield FX tests
        run: |
          node --test             tests/m01-battlefield-fx.test.js             tests/m01-battlefield-fx-polish-v3.test.js             tests/m01-demolition-cue.test.js

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture approved base before
        run: |
          set -euo pipefail
          mkdir -p docs/verification/m01-runtime/battlefield-fx-polish-v3
          git checkout 99309d9cb023cc94a07d41ff863e1362e4460570 --             src/render/m01-view.js src/render/m01-atmosphere.js
          npm run build
          M01_BASELINE_CAPTURE=1 npx playwright test tests/browser/m01-battlefield-fx-polish-v3.spec.js             --output=docs/verification/m01-runtime/battlefield-fx-polish-v3/before
          git checkout "$GITHUB_SHA" -- src/render/m01-view.js src/render/m01-atmosphere.js
          npm run build
          git diff --exit-code

      - name: Focused after browser
        run: |
          set -o pipefail
          npx playwright test             tests/browser/m01-battlefield-fx-polish-v3.spec.js             tests/browser/m01-battlefield-fx.spec.js             --output=docs/verification/m01-runtime/battlefield-fx-polish-v3/after             2>&1 | tee docs/verification/m01-runtime/battlefield-fx-polish-v3/browser.log

      - name: Gameplay and approved production passes unchanged
        run: |
          git diff --exit-code 99309d9cb023cc94a07d41ff863e1362e4460570 --             src/game src/world missions assets             src/render/m01-bridge-portal-polish.js             src/render/m01-environment.js src/render/m01-environment-props.js             src/render/m01-characters.js src/render/m01-actor-pose.js             src/render/m01-locomotive.js src/render/m01-panzerzug.js             src/render/m01-train-wagons.js src/render/m01-yard-wagons.js             src/render/m01-viewmodel.js             package.json package-lock.json playwright.config.js

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-battlefield-fx-polish-v3
          path: |
            docs/verification/m01-runtime/battlefield-fx-polish-v3/
            playwright-report/
            test-results/
          if-no-files-found: error
