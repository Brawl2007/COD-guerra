name: M01 Audio Core V1

on:
  push:
    branches: [claude/m01-audio-core-v1]

permissions:
  contents: read

concurrency:
  group: m01-audio-core-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Authority check (T06a is presentation core only, on the T05a tip 899937f)
        run: |
          set -o pipefail
          mkdir -p evidence
          git merge-base --is-ancestor 899937f HEAD
          echo "899937f is an ancestor of HEAD" | tee evidence/authority.log
          git diff --exit-code 899937f HEAD -- src/game src/render missions assets index.html src/main.js tests/fixtures package.json package-lock.json playwright.config.js 2>&1 | tee -a evidence/authority.log
          echo "game, render, missions, assets, entry points, golden fixtures and build config untouched since 899937f" | tee -a evidence/authority.log
          test ! -f tests/fixtures/.golden-stale
          git diff --name-only 899937f HEAD | tee evidence/changed-files.txt
      - name: Scope check (only the files T06a may change)
        run: |
          set -o pipefail
          bad="$(grep -vE '^(src/core/audio\.js|src/core/audio/[a-z-]+\.js|tests/audio-core\.test\.js|tests/helpers/fake-audio-context\.js|\.github/workflows/m01-audio-core-v1\.yml)$' evidence/changed-files.txt || true)"
          if [ -n "$bad" ]; then echo "files outside the T06a scope:"; echo "$bad"; exit 1; fi
          echo "all changed files are inside the T06a scope" | tee evidence/scope.log
      - name: Audio core tests (bounded: a runaway allocation must fail fast, not eat the runner)
        run: |
          set -o pipefail
          for f in tests/audio-core.test.js tests/m01-battlefield-audio.test.js tests/m01-audio-production.test.js; do
            NODE_OPTIONS=--max-old-space-size=1024 timeout 300 node --test "$f" 2>&1 | tee -a evidence/audio-tests.log
          done
      - name: Byte guards
        run: set -o pipefail; node --test tests/m01-locomotive.test.js tests/m01-panzerzug.test.js tests/m01-soldier-visual-variation.test.js 2>&1 | tee evidence/byte-guards.log
      - name: npm test
        run: set -o pipefail; npm test 2>&1 | tee evidence/npm-test.log
      - name: Golden proof line
        run: |
          set -o pipefail
          grep -E '^\s*(ok [0-9]+ - |✔ )all gameplay bytes hashed each tick against approved base' evidence/npm-test.log | tee evidence/proof-lines.txt
          test "$(grep -cE '^\s*(not ok [0-9]+ - |✖ )all gameplay bytes hashed each tick against approved base' evidence/npm-test.log)" = 0
          test "$(grep -cE '^\s*(ok [0-9]+ - |✔ )all gameplay bytes hashed each tick against approved base' evidence/npm-test.log)" -ge 1
      - name: npm run build
        id: build
        if: ${{ !cancelled() }}
        run: set -o pipefail; npm run build 2>&1 | tee evidence/build.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-audio-core-v1-${{ github.sha }}
          path: evidence/
          if-no-files-found: ignore
