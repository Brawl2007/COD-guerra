name: M01 Argon V2 — confirmação rápida das 4 falhas
on:
  push:
    branches: [argon/m01-animation-resolver-v2-ik-reload-hit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: CKM, idempotência, MG34 e transporte de feridos
        run: node --test tests/m01-render-idempotence.test.js tests/m01-ckm-runtime.test.js tests/m01-mg34-prone-presentation.test.js tests/m01-station-drag-runtime.test.js
      - name: Preservação de gameplay, comboios e variação visual
        run: node --test tests/m01-locomotive.test.js tests/m01-panzerzug.test.js tests/m01-soldier-visual-variation.test.js
      - name: Animation Resolver V1 e V2
        run: node --test tests/m01-animation-resolver.test.js tests/m01-animation-resolver-v2.test.js
      - name: Build sem deploy
        run: npm run build
