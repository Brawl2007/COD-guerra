name: M01 Stack Integration T08 T12 V1

on:
  push:
    branches: [claude/m01-stack-integration-t08-t12-v1]

permissions:
  contents: read

concurrency:
  group: m01-stack-integration-t08-t12-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Authority check (T08 + T12 + shared allowlist on the stack tip 1990a58)
        run: |
          set -o pipefail
          mkdir -p evidence
          for c in 1990a58 fb9968b 0579302; do git merge-base --is-ancestor $c HEAD; echo "$c is an ancestor of HEAD" | tee -a evidence/authority.log; done
          test "$(git rev-parse HEAD:assets/models/provisional/m01/props)" = b0dc74ece8f46e6633e5e8427adb984b6a55276d
          test "$(git rev-parse HEAD:tools/assets/m01-props)" = 407e9e0eb12cdab1569bf0a770f2e10592a6f88a
          test "$(git rev-parse HEAD:docs/assets/m01-props)" = 1d33944e1d77e47386edf246f2875b19ce94086c
          test "$(git rev-parse HEAD:tests/m01-props-kit.test.js)" = 8c1e98103fd8f39d03a5ef9e7bbc74f8e99ee73d
          echo "T12 trees equal 934b274 (cherry-pick, D36)" | tee -a evidence/authority.log
          for p in assets/models/provisional/m01/characters/clip-library-v2 tools/assets/m01-soldiers tests/m01-soldiers-glb.test.js; do test "$(git rev-parse HEAD:$p)" = "$(git rev-parse 0579302:$p)"; done
          echo "T08 trees equal 0579302" | tee -a evidence/authority.log
          test "$(git rev-parse HEAD:tests/helpers/m01-byte-guard-allowlist.js)" = d4427a6f1375e8b6172f7cf2d4dffb1dcf78ed2f
          git diff --exit-code 1990a58 HEAD -- src missions package.json package-lock.json playwright.config.js tests/fixtures tests/helpers/m01-anim-baseline.mjs 2>&1 | tee -a evidence/authority.log
          echo "src, missions, build config, golden and baseline helper untouched since 1990a58" | tee -a evidence/authority.log
          test -z "$(git diff --name-status --diff-filter=DMRT 1990a58 HEAD -- assets)"
          ! git diff --name-only --diff-filter=A 1990a58 HEAD -- assets | grep -vE '^assets/models/provisional/m01/(props|characters/clip-library-v2)/'
          echo "assets: additions only in props/ and characters/clip-library-v2/" | tee -a evidence/authority.log
          test ! -f tests/fixtures/.golden-stale
          echo "no golden marker: the committed x86 golden is verified, never regenerated" | tee -a evidence/authority.log
          test "$(sha256sum tests/fixtures/m01-anim-gameplay-baseline.json | cut -d' ' -f1)" = 8663029553ca161c21b44b9b44de2f03a7cd23ed334b1875af9aa9fd5bb13d3b
          echo "golden sha256 unchanged" | tee -a evidence/authority.log
      - name: Golden base is the simulation shipped in this checkout
        run: |
          set -o pipefail
          BASE=$(grep -oE "const base='[0-9a-f]{40}'" tests/helpers/m01-anim-baseline.mjs | grep -oE "[0-9a-f]{40}")
          test -n "$BASE"
          echo "golden base: $BASE" | tee evidence/golden-base.log
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- src/game/m01-simulation.js 2>&1 | tee -a evidence/golden-base.log
          sha256sum tests/fixtures/m01-anim-gameplay-baseline.json | tee -a evidence/golden-base.log
      - name: Byte guards
        run: set -o pipefail; node --test tests/m01-locomotive.test.js tests/m01-panzerzug.test.js tests/m01-soldier-visual-variation.test.js 2>&1 | tee evidence/byte-guards.log
      - name: npm test
        env:
          M01_DISPLAY_FIRE_REPORT: ${{ github.workspace }}/evidence/display-fire-sweep.json
          M01_EAST_FRONT_REPORT: ${{ github.workspace }}/evidence/east-front-sweep.json
        run: set -o pipefail; npm test 2>&1 | tee evidence/npm-test.log
      - name: Golden, 12-seed and east-front proof lines
        run: |
          set -o pipefail
          OK='^\s*(ok [0-9]+ - |✔ )'; BAD='^\s*(not ok [0-9]+ - |✖ )'
          NAMES='(all gameplay bytes hashed each tick against approved base|route seed [0-9]+:|east front seed [0-9]+:|east front with covering fire)'
          grep -E "($OK|$BAD)$NAMES" evidence/npm-test.log | tee evidence/proof-lines.txt
          if grep -qE "$BAD$NAMES" evidence/npm-test.log; then echo "FAIL: a proof line is not ok" | tee -a evidence/proof-lines.txt; exit 1; fi
          test "$(grep -cE "${OK}all gameplay bytes hashed each tick against approved base" evidence/npm-test.log)" = 2
          test "$(grep -cE "${OK}route seed [0-9]+:" evidence/npm-test.log)" = 12
          test "$(grep -cE "${OK}east front seed [0-9]+:" evidence/npm-test.log)" = 12
          test "$(grep -cE "${OK}east front with covering fire" evidence/npm-test.log)" = 1
      - name: Clip library and props proof lines
        env: {LC_ALL: C.UTF-8}
        run: |
          set -o pipefail
          OK='^\s*(ok [0-9]+ - |✔ )'; BAD='^\s*(not ok [0-9]+ - |✖ )'
          NAMES='(clip library V2: manifest|the shipped clips and every preserved file are byte-identical|sprint, crouch walk, hit_front|clip extras are the 240 Hz|loops are continuous at the ends|runtime keys: locomotion clips|the skinned LOD1 body stays out|manifest sources, preserved files)'
          PNAMES='(o gerador reproduz byte a byte|gerador portável:|manifesto: autor|orçamentos:|tamanhos reais|GLB válidos:|o vão de fio)'
          grep -E "($OK|$BAD)($NAMES|$PNAMES)" evidence/npm-test.log | tee evidence/proof-lines-t08-t12.txt
          if grep -qE "$BAD($NAMES|$PNAMES)" evidence/npm-test.log; then echo "FAIL: a proof line is not ok" | tee -a evidence/proof-lines-t08-t12.txt; exit 1; fi
          test "$(grep -cE "${OK}$NAMES" evidence/npm-test.log)" = 8
          test "$(grep -cE "${OK}$PNAMES" evidence/npm-test.log)" = 9
      - name: npm run build
        id: build
        if: ${{ !cancelled() }}
        run: set -o pipefail; npm run build 2>&1 | tee evidence/build.log
      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Browser - distant front impostors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; npx playwright test tests/browser/m01-distant-front-impostors.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser-impostors.log
      - name: Browser - m01.spec.js German fire and withdrawal continuation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; npx playwright test tests/browser/m01.spec.js --grep "German fire on the repair|a real withdrawal continuation" --workers=1 --retries=0 2>&1 | tee evidence/browser-m01.log
      - name: Browser - yard wagon runtime integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; npx playwright test tests/browser/m01-wagon-runtime-integration.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser-wagons.log
      - name: Browser - anim resolver
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; npx playwright test tests/browser/m01-anim-resolver.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser-anim-resolver.log
      - name: Browser - animation contract
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; npx playwright test tests/browser/m01-animation-contract.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser-animation-contract.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-stack-integration-t08-t12-v1-${{ github.sha }}
          path: |
            evidence/
            test-results/
            playwright-report/
          if-no-files-found: ignore
