name: M01 ready deliveries consolidation V2

on:
  push:
    branches:
      - codex/m01-ready-deliveries-consolidation-v2

permissions:
  contents: read

concurrency:
  group: m01-ready-deliveries-consolidation-v2
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Complete Node suite — deterministic file shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t selected < <(find tests -maxdepth 1 -type f -name '*.test.js' | LC_ALL=C sort | awk -v shard="$SHARD" '(NR-1)%4==shard {print}')
          printf 'Shard %s: %s files\n' "$SHARD" "${#selected[@]}"
          test "${#selected[@]}" -gt 0
          node --test --test-concurrency=1 "${selected[@]}"

  production-build:
    needs: node-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build complete candidate
        run: npm run build

  focused-browser:
    needs: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regressions of combined deliveries
        run: >-
          npx playwright test
          tests/browser/m01-bridge-structural.spec.js
          tests/browser/m01-vegetation-lod.spec.js
          tests/browser/m01-hud-presentation.spec.js
          tests/browser/m01-battlefield-audio-runtime.spec.js
          tests/browser/m01-train-consist-polish.spec.js
          tests/browser/m01-weapon-presentation.spec.js
          tests/browser/m01-damage-decals.spec.js
          tests/browser/m01.spec.js
          --workers=1
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-ready-deliveries-v2-browser
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
