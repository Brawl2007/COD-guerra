name: M01 T10 T29 vegetation browser and authority
on:
  push:
    branches: [codex/m01-t10-t29-vegetation-v2]
    paths: [src/render/**, assets/models/provisional/m01/vegetation/**, tools/assets/m01-vegetation/**, tests/*vegetation*.test.js, tests/browser/*vegetation*.spec.js, tools/verification/*vegetation-v2*, .github/workflows/m01-t10-t29-vegetation.yml]
  pull_request:
    branches: [main]
    paths: [src/render/m01-vegetation-*.js, assets/models/provisional/m01/vegetation/**, tests/browser/*vegetation*.spec.js]
permissions: {contents: read}
concurrency:
  group: m01-t10-t29-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Preserve gameplay, layout, old assets and presentation owners
        run: |
          git diff --exit-code b2430fac3504aa6d0ce7d0ad664076c26f90d6f7 HEAD -- src/game src/core src/world missions src/assets assets/textures assets/models/provisional/m01/structures assets/models/provisional/m01/props assets/models/provisional/m01/bridges src/render/m01-vegetation-layout.js src/render/m01-damage-decals.js src/render/m01-terrain-envelope.js src/render/m01-terrain-relief.js src/render/m01-far-landscape.js src/render/m01-track-bed.js src/render/m01-props-runtime.js src/render/m01-environment-props.js src/render/m01-field-structures.js src/render/m01-station-architecture.js src/render/m01-bridge-structure.js src/render/m01-bridge-portal-polish.js src/render/m01-train-consist-detail.js src/render/m01-locomotive.js src/render/m01-train-wagons.js src/render/m01-terrain-material.js src/render/m01-terrain-mask.js src/render/m01-lighting.js src/render/materials.js package.json package-lock.json playwright.config.js vite.config.js
          npm run assets:m01:colliders -- --check
          node tools/verify-m01-route.mjs
      - run: npx playwright install --with-deps chromium
      - name: Untouched base production captures and 24 active-owner control futures
        run: |
          git worktree add --detach test-results/vegetation-baseline b2430fac3504aa6d0ce7d0ad664076c26f90d6f7
          ln -s "$GITHUB_WORKSPACE/node_modules" test-results/vegetation-baseline/node_modules
          node tools/verification/m01-vegetation-v2-futures.mjs --baseline test-results/vegetation-baseline --out test-results/m01-vegetation-v2-futures.json
          (cd test-results/vegetation-baseline && npx vite build)
          M01_VEGETATION_BASELINE_MODE=1 M01_VEGETATION_BASELINE_ROOT="$GITHUB_WORKSPACE/test-results/vegetation-baseline" M01_VEGETATION_OUTPUT_DIR=test-results/vegetation-baseline-captures npx playwright test --config tools/verification/m01-vegetation-v2-runtime.config.mjs --grep 'actual frozen' --output=test-results/vegetation-baseline-browser
      - name: Actual original kit gallery
        run: |
          npx vite build --config tools/assets/m01-vegetation/viewer-config.mjs
          M01_VEGETATION_OUTPUT_DIR=test-results/vegetation-kit npx playwright test --config tools/verification/m01-vegetation-v2-kit.config.mjs --output=test-results/vegetation-kit-browser
      - name: Production vegetation residency, actual budgets, loading, restore and pixels
        # Builds only prepare production previews. Normal CI owns Node/tooling and build validation.
        run: |
          npx vite build
          M01_VEGETATION_OUTPUT_DIR=test-results/vegetation-runtime npx playwright test --config tools/verification/m01-vegetation-v2-runtime.config.mjs --output=test-results/vegetation-runtime-browser
      - name: Exact frozen base/current save, camera, clock and pixels
        run: node tools/verification/m01-vegetation-v2-compare.mjs test-results/vegetation-baseline-captures test-results/vegetation-runtime test-results/m01-vegetation-v2-pixels.json
      - name: Preserve accepted coupled terrain, horizon, rail, props and material browser obligations
        run: |
          npx playwright test --config tools/verification/playwright.m01-relief-horizon.config.js --output=test-results/vegetation-prior-relief
          npx playwright test --config tools/verification/playwright.m01-rail-props.config.js --output=test-results/vegetation-prior-rail
          npx playwright test --config tools/verification/playwright.m01-materials.config.js --output=test-results/vegetation-prior-materials
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-t10-t29-${{ github.sha }}
          path: |
            test-results/vegetation-*-captures/
            test-results/vegetation-*-browser/
            test-results/vegetation-kit/
            test-results/vegetation-runtime/
            test-results/vegetation-prior-*/
            test-results/m01-vegetation-v2-futures.json
            test-results/m01-vegetation-v2-pixels.json
            test-results/m01-relief-horizon/
            test-results/m01-rail-props/
          if-no-files-found: error
