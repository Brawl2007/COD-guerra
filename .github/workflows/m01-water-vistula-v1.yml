name: M01 Water Vistula V1

on:
  push:
    branches: [claude/m01-water-vistula-v1]

permissions:
  contents: read

concurrency:
  group: m01-water-vistula-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Authority check (presentation only)
        run: |
          set -o pipefail
          mkdir -p evidence
          # Base: the accepted T18 evidence commit. Simulation, world, core, missions, assets and the build/test config must not change.
          git diff --exit-code a1554f3 HEAD -- src/game src/world src/core missions assets package.json package-lock.json playwright.config.js 2>&1 | tee evidence/authority.log
          echo "authority diff clean against a1554f3" | tee -a evidence/authority.log
          # The simulation, world and core must not import the presentation module.
          # (explicit if/exit: a bare '! grep' is exempt from 'bash -e' and could never fail the step)
          if grep -rn "m01-water" src/game src/world src/core 2>&1 | tee -a evidence/authority.log; then echo "FAIL: src/game, src/world or src/core references m01-water" | tee -a evidence/authority.log; exit 1; fi
          echo "no m01-water reference in src/game, src/world, src/core" | tee -a evidence/authority.log
      - name: npm test (TAP evidence)
        run: set -o pipefail; npm test -- --test-reporter=tap 2>&1 | tee evidence/npm-test.tap
      - name: npm run build
        run: set -o pipefail; npm run build 2>&1 | tee evidence/build.log
      - run: npx playwright install --with-deps chromium
      - name: Focused browser specs (water + T18 demolition regression)
        run: set -o pipefail; npx playwright test tests/browser/m01-water-vistula.spec.js tests/browser/m01-demolition-setpiece.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser.log
      - name: BEFORE capture on the base commit (evidence only)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p evidence/before
          git worktree add ../base a1554f3
          cp tests/browser/m01-water-vistula.spec.js ../base/tests/browser/
          cd ../base && npm ci && npm run build
          M01_WATER_BASELINE=1 npx playwright test tests/browser/m01-water-vistula.spec.js --workers=1 --retries=0 --output=../COD-guerra-before 2>&1 | tee ../COD-guerra/evidence/before/browser-before.log
          mkdir -p ../COD-guerra/evidence/before/png && find ../COD-guerra-before -name '*-before*' -exec cp {} ../COD-guerra/evidence/before/png/ \;
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-water-vistula-v1-${{ github.sha }}
          path: |
            evidence/
            test-results/
            playwright-report/
          if-no-files-found: ignore
