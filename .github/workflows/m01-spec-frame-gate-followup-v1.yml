name: M01 Spec Frame Gate Followup V1

on:
  push:
    branches: [claude/m01-spec-frame-gate-followup-v1]

permissions:
  contents: read

concurrency:
  group: m01-spec-frame-gate-followup-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Authority check (spec-only change on 2d65dd0)
        run: |
          set -o pipefail
          mkdir -p evidence
          git diff --exit-code 2d65dd0 HEAD -- src missions assets tests/fixtures package.json package-lock.json playwright.config.js 2>&1 | tee evidence/authority.log
          echo "src, missions, assets, golden and build config untouched since 2d65dd0" | tee -a evidence/authority.log
      - name: npm test
        run: set -o pipefail; npm test 2>&1 | tee evidence/npm-test.log
      - name: npm run build
        id: build
        if: ${{ !cancelled() }}
        run: set -o pipefail; npm run build 2>&1 | tee evidence/build.log
      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Browser - water Vistula
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; npx playwright test tests/browser/m01-water-vistula.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser-water-vistula.log
      - name: Browser - lighting dawn
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; npx playwright test tests/browser/m01-lighting-dawn.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser-lighting-dawn.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-spec-frame-gate-followup-v1-${{ github.sha }}
          path: |
            evidence/
            test-results/
            playwright-report/
          if-no-files-found: ignore
