name: M01 Demolition setpiece V2

on:
  push:
    branches: [claude/m01-demolition-setpiece-v2]

permissions:
  contents: read

concurrency:
  group: m01-demolition-setpiece-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Authority check (presentation only)
        run: |
          set -o pipefail
          mkdir -p evidence
          # Base: the accepted T17 Stuka evidence commit. Simulation, world, core, missions, assets and the build/test config must not change.
          git diff --exit-code f8cbe39 HEAD -- src/game src/world src/core missions assets package.json package-lock.json playwright.config.js 2>&1 | tee evidence/authority.log
          echo "authority diff clean against f8cbe39" | tee -a evidence/authority.log
          # The simulation, world and core must not import the presentation module.
          # (explicit if/exit: a bare '! grep' is exempt from 'bash -e' and could never fail the step)
          if grep -rn "m01-demolition" src/game src/world src/core 2>&1 | tee -a evidence/authority.log; then echo "FAIL: src/game, src/world or src/core references m01-demolition" | tee -a evidence/authority.log; exit 1; fi
          echo "no m01-demolition reference in src/game, src/world, src/core" | tee -a evidence/authority.log
      - name: npm test (TAP evidence)
        run: set -o pipefail; npm test -- --test-reporter=tap 2>&1 | tee evidence/npm-test.tap
      - name: npm run build
        run: set -o pipefail; npm run build 2>&1 | tee evidence/build.log
      - run: npx playwright install --with-deps chromium
      - name: Focused browser specs (demolition set-piece + FX V3 regression)
        run: set -o pipefail; npx playwright test tests/browser/m01-demolition-setpiece.spec.js tests/browser/m01-battlefield-fx-polish-v3.spec.js --workers=1 --retries=0 2>&1 | tee evidence/browser.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-demolition-setpiece-v2-${{ github.sha }}
          path: |
            evidence/
            test-results/
            playwright-report/
          if-no-files-found: ignore
